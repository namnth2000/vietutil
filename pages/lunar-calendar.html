    <main id="main">
      <div class="container columns">
        <section class="panel">
          <header class="page-header">
            <h1>Lịch âm</h1>
          </header>

          <form data-lunar-form>
            <label for="solarDate">Ngày dương lịch</label>
            <input id="solarDate" type="date" required />
            <div class="actions">
              <button class="btn-primary" type="submit">Xem kết quả</button>
            </div>
          </form>

          <div class="result" data-lunar-output aria-live="polite"></div>
          <div class="result" data-lunar-nearest aria-live="polite"></div>
        </section>

        <aside class="panel">
          <div class="lunar-month-cal" data-lunar-month-cal>
            <div class="lunar-month-cal__title-row">
              <h2>Lịch tháng</h2>
              <button type="button" class="lunar-month-cal__today" data-cal-today>Quay về ngày hiện tại</button>
            </div>
            <div class="lunar-month-cal__header">
              <button type="button" class="lunar-month-cal__nav" data-cal-prev aria-label="Tháng trước">&#8249;</button>
              <h3 data-cal-title>Tháng &nbsp;</h3>
              <button type="button" class="lunar-month-cal__nav" data-cal-next aria-label="Tháng sau">&#8250;</button>
            </div>
            <div class="lunar-month-cal__weekdays">
              <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
            </div>
            <div class="lunar-month-cal__grid" data-cal-grid></div>
            <p class="lunar-month-cal__legend">
              <span class="legend-dot legend-dot--mung1"></span>Mùng 1
              <span class="legend-dot legend-dot--ram"></span>Ngày rằm
              <span class="legend-dot legend-dot--today"></span>Hôm nay
            </p>
          </div>
          <!-- <p class="notice">Thuật toán chạy 100% trên trình duyệt, không gửi dữ liệu cá nhân lên server.</p> -->
        </aside>
